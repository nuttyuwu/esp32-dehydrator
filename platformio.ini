; Hybrid solar/electric food dehydrator — ESP32-WROVER
;
;   pio run -e sim -t upload      firmware, simulated sensors + serial TUI
;   pio run -e sim -t uploadfs    web page into LittleFS
;   pio device monitor -b 115200  the TUI
;   pio run -e hw  -t upload      real SHT31 + relays
;   pio test -e native            unit tests on the host, no board needed

[platformio]
default_envs = sim

[common]
build_flags =
    -std=gnu++17
    -Wall
    -I $PROJECT_SRC_DIR
build_unflags = -std=gnu++11

[esp32]
platform = espressif32@^6.9.0
; The attached board identifies itself as WROOM-32 (its ROM log says module_name:WROOM-32,
; 4 MB flash, chip rev 3) — not a WROVER. esp32dev + no PSRAM is correct for WROOM and is
; also safe on a WROVER; this firmware peaks at ~14 % of internal RAM and never needs PSRAM.
; If a real WROVER turns up later, `board = esp-wrover-kit` + -DBOARD_HAS_PSRAM is the swap
; — and only then do GPIO 16/17 become unavailable.
board = esp32dev
framework = arduino
board_build.partitions = default.csv
board_build.filesystem = littlefs
; Must be repeated here: `extends` inherits options, but ${common.build_flags} only
; interpolates that one value — build_unflags would not carry over on its own, and the
; framework's own -std=gnu++11 would win.
build_unflags = -std=gnu++11
monitor_speed = 115200
; send_on_enter + echo + LF: the serial monitor becomes a usable TUI console — you see what
; you type, and the line goes out only when you press Enter.
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
monitor_eol = LF
; RTS drives EN on this board. pyserial asserts RTS when it opens a port, which would hold
; the chip in reset for as long as the monitor is open — a silent, blank console that looks
; like dead firmware. Keep both modem lines deasserted.
monitor_dtr = 0
monitor_rts = 0
; 460800 flashes the image in ~14 s and is stable on this board's CH340. If a board ever
; dies mid-write with "The chip stopped responding", drop to 115200 — that is the adapter
; losing sync under sustained throughput, not a firmware problem.
upload_speed = 460800
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1
; If the registry ever renames these, the same libraries live at
;   mathieucarbou/ESPAsyncWebServer  (older name)
;   https://github.com/ESP32Async/ESPAsyncWebServer.git
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.3.0

[env:sim]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DBUILD_SIM=1
build_src_filter = +<*> -<hal/Sht31Sensors.cpp> -<hal/GpioActuators.cpp>

[env:hw]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DBUILD_HW=1
build_src_filter = +<*> -<hal/SimSensors.cpp> -<hal/SimActuators.cpp> -<sim/> -<tui/>
lib_deps =
    ${esp32.lib_deps}
    adafruit/Adafruit SHT31 Library@^2.2.2

; Host build: core/ and sim/ are pure C++17 and compile without Arduino.
[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -DBUILD_NATIVE=1
test_build_src = yes
build_src_filter = +<core/> +<sim/>
